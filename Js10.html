<!DOCTYPE html>
<html>
    <head>
        <title>element click handler</title>
    </head>
    <body>
        <script>
             
    function stop(){
        alert("Ouch! Stop it!"); 
    }
    function reveal(el){
console.log(el);
console.log(el.parentElement);}

function toggleDisplay(){
let p = document.getElementById("magic");
if(p.style.display === "none") {
p.style.display = "block";
} else {
p.style.display = "none";
}
}
function rainbowify(){
let divs = document.getElementsByTagName("div");
for(let i = 0; i < divs.length; i++) {
divs[i].style.backgroundColor = divs[i].id;
}
}
    
    document.getElementById("one").onclick = function () {
                alert("auh, stop there!");
    } // position matters

    </script>

    <style>
div {
height: 30px;
width: 30px;
background-color: white;
}
</style>
        <div id="one" onclick="alert('Ouch! Stop it!')">Don't click here!</div>
        <button onclick="reveal(this)">Click here!</button>
        <p id="magic">I might disappear and appear.</p>
<button onclick="toggleDisplay()">Magic!</button>

<div id="red"></div>
<div id="orange"></div>
<div id="yellow"></div>
<div id="green"></div>
<div id="blue"></div>
<div id="indigo"></div>
<div id="violet"></div>
<button onclick="rainbowify()">Make me a rainbow</button>
    </body>
</html>
