    <body>
        <script type="text/javascript">
            function isPrime(start,end) {
                console.log("Prime Numbers between " + start+ "and" + end +"are:");
                for(let i = start; i<= end; i++) {
                    let count = 1;
                    for(let j = 2; j<= i; j++) {
                        if(i % j == 0) {
                            count++;
                        }
                    }
                    if(count == 2) {
                        console.log(i);
                    }
                }
                
            }
            isPrime(10, 50);



        </script>
