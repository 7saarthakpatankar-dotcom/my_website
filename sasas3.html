<!DOCTYPE html>
<html>
    <head>
        <title>

        </title>
    </head>
    <body>
        
        <script type="text/javascript">
            let start = 10;
            function loop1(val){
                console.log(val);

                if(val < 1){ 
                return;
                }
                if(val > 1) {
                    val--;
                
                return loop1(val);
                }
            }
            loop1(start);


            function loop2(val) {
                console.log(val);

                if(val > 0) {
                    val--;
                    return loop2(val);
                }
                return;
            }
            loop2(start);


        </script>
    </body>
</html>
