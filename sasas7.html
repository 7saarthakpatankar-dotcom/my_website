<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <script type="text/javascript">
            let day = parseFloat(prompt("Enter no:"));
            let dayn;

            switch(day) {
                case 1: 
                dayn = "Sunday";
                break;
                case 2: 
                dayn = "Monday";
                break;
                case 3: 
                dayn = " Tuesday";
                break;
                case 4:
                dayn = "Wednesday";
                break;
                case 5:
                 dayn = "Thursday";
                 break;
                 case 6:
                 dayn = "Friday";
                 break;
                 case 7: 
                 dayn = "Saturday";
                 break;
                 default: 
                 dayn = "invalid";      
                    

            }
            console.log(dayn);


        </script>
    </body>
</html>
